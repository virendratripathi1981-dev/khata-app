<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Anushka Computech Pvt. Ltd.</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Anushka Computech" />
<meta name="theme-color" content="#12233f" />
<link rel="apple-touch-icon" id="appleTouchIcon" href="" />
<style>
:root{
  --navy:#12233f; --navy-2:#1c3557; --navy-3:#0a1626;
  --gold:#c99a44; --gold-soft:#e8c98a;
  --paper:#f6f3ec; --card:#ffffff;
  --ink:#1c1c1a; --ink-soft:#5c5850;
  --line:#e4ddcd;
  --green:#2f7d4f; --red:#b8433a; --amber:#a9762c;
  --radius:14px;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Iowan Old Style','Georgia',serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:78px;
}
.num, input, select, textarea, table, button, .tabbar, .topbar, .pill, .kpi-num{
  font-family:'Charter','Iowan Old Style',ui-serif,Georgia,serif;
}
.mono{font-family:'SF Mono','Menlo',monospace; font-variant-numeric: tabular-nums;}
h1,h2,h3{font-family:'Iowan Old Style','Georgia',serif; letter-spacing:.2px; margin:0;}
::selection{background:var(--gold-soft);}

/* Top bar */
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#f4ecd8;
  padding:14px 16px 12px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .mark{
  width:38px;height:38px;border-radius:10px;
  overflow:hidden; background:#fff;
  display:flex;align-items:center;justify-content:center;
}
.brand .mark img{ width:100%; height:100%; object-fit:cover; }
.brand-name{font-size:16px; font-weight:600; line-height:1.15;}
@media(max-width:380px){ #syncedLabel{display:none;} .brand-name{font-size:14.5px;} }
.brand-sub{font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold-soft); opacity:.85;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,125,79,.25);}

.wrap{max-width:920px;margin:0 auto;padding:16px;}

/* Cards */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(20,20,10,.04);
}
.card h2{font-size:15px; text-transform:uppercase; letter-spacing:1.1px; color:var(--navy); margin-bottom:2px;}
.card .hint{font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; font-family:ui-serif,serif; font-style:italic;}

/* KPI row */
.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr);}}
.kpi{
  background:var(--navy); color:#f4ecd8; border-radius:var(--radius); padding:14px;
  position:relative; overflow:hidden;
}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:rgba(201,154,68,.12);}
.kpi .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--gold-soft); opacity:.9;}
.kpi .kpi-num{font-size:21px; font-weight:600; margin-top:4px;}
.kpi.bad{background:var(--navy-3);}

/* Forms */
label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); margin:10px 0 4px;}
input,select,textarea{
  width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px;
  background:#fdfcf9; font-size:15px; color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-soft); border-color:var(--gold);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 12px;}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr;}}

button{
  cursor:pointer; border:none; border-radius:10px; padding:11px 16px; font-size:14.5px;
  font-weight:600; letter-spacing:.3px;
}
.btn-primary{background:var(--navy); color:#f4ecd8;}
.btn-primary:active{background:var(--navy-3);}
.btn-gold{background:var(--gold); color:var(--navy-3);}
.btn-ghost{background:transparent; color:var(--navy); border:1px solid var(--line);}
.btn-danger{background:#fff; color:var(--red); border:1px solid #e7c9c4;}
.btn-row{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px;}

/* Table (ledger style) */
.tbl-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--line);}
table{width:100%; border-collapse:collapse; min-width:600px;}
th,td{padding:9px 10px; text-align:left; font-size:13px; border-bottom:1px solid var(--line); white-space:nowrap;}
th{background:#f1ece0; color:var(--navy); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:.5px; position:sticky; top:0;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#faf7ef;}
td.num{text-align:right; font-family:'SF Mono',Menlo,monospace; font-variant-numeric:tabular-nums;}
.tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
.tag-green{background:#e4f2e8; color:var(--green);}
.tag-red{background:#fbe9e7; color:var(--red);}
.tag-amber{background:#f7ecd8; color:var(--amber);}
.tag-navy{background:#e6ebf3; color:var(--navy);}

/* Tabs (sub-nav within a page) */
.subtabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
.subtabs button{background:#fff; color:var(--ink-soft); border:1px solid var(--line); white-space:nowrap; padding:8px 13px; font-size:12.5px; border-radius:20px;}
.subtabs button.active{background:var(--navy); color:#f4ecd8; border-color:var(--navy);}

/* Bottom tab bar */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:rgba(18,35,63,.97); backdrop-filter:blur(6px);
  display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 12px rgba(0,0,0,.2);
}
.tabbar button{
  background:none; color:#a9b6cb; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:4px 6px; font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; font-weight:600;
  border-radius:8px; min-width:52px;
}
.tabbar button .ic{font-size:18px;}
.tabbar button.active{color:var(--gold-soft);}

.section{display:none;}
.section.active{display:block;}

.empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-style:italic;}
.divider{height:1px; background:var(--line); margin:14px 0;}
.row-flex{display:flex; justify-content:space-between; align-items:center;}
.small{font-size:12px; color:var(--ink-soft);}
.stat-line{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
.stat-line:last-child{border-bottom:none;}
.stat-line b{font-family:'SF Mono',Menlo,monospace;}

.modal-bg{position:fixed; inset:0; background:rgba(10,15,25,.5); z-index:50; display:none; align-items:flex-end; justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:var(--paper); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px; animation:up .2s ease;}
@media(min-width:640px){.modal-bg{align-items:center;} .modal{border-radius:16px;}}
@keyframes up{from{transform:translateY(30px); opacity:0} to{transform:translateY(0); opacity:1}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.close-x{background:none; color:var(--ink-soft); font-size:22px; padding:0 6px;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;}
.toast.show{opacity:1;}

.loading{display:flex; align-items:center; justify-content:center; padding:60px 0; color:var(--ink-soft); font-style:italic;}

/* ===== Print-only quotation sheet ===== */
.print-only{ display:none; }
.print-only table th{position:static;}
@media print{
  @page{ size: A4; margin: 0; }
  html, body{ width:210mm; height:297mm; margin:0; padding:0; background:#fff; }
  body *{ visibility:hidden; }
  .print-only, .print-only *{ visibility:visible; }
  /* When the app is using the on-page Print Preview, print THAT preview too.
     Previously only .print-only was made visible, so Chrome printed a blank page. */
  body.same-tab-printing #sameTabPrint,
  body.same-tab-printing #sameTabPrint *{ visibility:visible !important; }
  body.same-tab-printing #sameTabPrint{
    display:block !important; position:static !important; overflow:visible !important;
    width:210mm !important; min-height:297mm !important; margin:0 !important; padding:0 !important;
    background:#fff !important;
  }
  body.same-tab-printing #sameTabPrintControls{ display:none !important; }
  body.same-tab-printing #sameTabPrintContent{
    display:block !important; width:210mm !important; min-height:297mm !important;
    margin:0 !important; padding:0 !important; background:#fff !important;
  }
  .print-only{
    display:block; position:absolute; top:0; left:0;
    width:210mm; height:297mm; margin:0; padding:0;
    font-family:'Calibri','Segoe UI',Helvetica,Arial,sans-serif; color:#111; background:#fff;
  }
  .topbar, .tabbar, .modal-bg, .toast{ display:none !important; }
  .qp-table tr{ page-break-inside: avoid; }
  .ps-grid, .ps-att, .ps-earn{ page-break-inside: avoid; break-inside: avoid; }
  .ps-grid tr, .ps-att tr, .ps-earn tr{ page-break-inside: avoid; break-inside: avoid; }
  .ps-sign-row{ page-break-inside: avoid; break-inside: avoid; }
  .qp-bottom{ page-break-inside: avoid; break-inside: avoid; }
  .qp-financials{ page-break-inside: avoid; break-inside: avoid; }
  .qp-legal{ page-break-inside: avoid; break-inside: avoid; }
  .qp-signblock{ page-break-inside: avoid; break-inside: avoid; }
}
.qp-page{
  box-sizing:border-box;
  width:210mm; padding:11mm 13mm;
  display:flex; flex-direction:column;
  color:#111;
}
.qp-page.qp-fullpage{ min-height:297mm; }
.qp-body{ }
.qp-bottom{ padding-top:14px; flex:1 0 auto; display:flex; flex-direction:column; }
.qp-financials{ margin-top:auto; padding-top:20px; }
.qp-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #12233f; padding-bottom:6px; margin-bottom:9px; }
.qp-head .qp-brand{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
.qp-head img{ display:block; }
.qp-head .qp-co-name{ font-size:13px; font-weight:700; color:#12233f; letter-spacing:.3px; }
.qp-head .qp-co-sub{ font-size:8.5px; color:#555; margin-top:2px; line-height:1.5; max-width:320px; }
.qp-head .qp-title{ text-align:right; }
.qp-head .qp-title h1{ font-size:16px; letter-spacing:2px; color:#12233f; margin:0 0 6px; }
.qp-head .qp-title .qp-meta{ font-size:9px; color:#333; line-height:1.7; }
.qp-billto{ display:flex; justify-content:space-between; gap:18px; margin-bottom:10px; }
.qp-billto .qp-block{ flex:1; }
.qp-billto .qp-label{ font-size:8px; text-transform:uppercase; letter-spacing:1px; color:#888; margin-bottom:4px; }
.qp-billto .qp-name{ font-weight:700; font-size:11.5px; color:#12233f; }
.qp-billto .qp-detail{ font-size:9.5px; color:#333; line-height:1.6; margin-top:2px; }
.qp-table{ width:100%; border-collapse:collapse; margin-bottom:4px; }
.qp-items-table{ table-layout:fixed; }
.qp-table th{ background:transparent; color:#000; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.3px; padding:8px 7px; text-align:left; border-bottom:3px solid #12233f; white-space:normal; }
.qp-table td{ padding:8px 7px; font-size:13px; color:#000; border-bottom:1px solid #ddd; white-space:normal; }
.qp-items-table td:nth-child(1){ font-weight:600; }
.qp-items-table td:nth-child(2){ color:#222; }
.qp-items-table th:nth-child(1), .qp-items-table td:nth-child(1){ width:34%; }
.qp-items-table th:nth-child(2), .qp-items-table td:nth-child(2){ width:12%; text-align:center; }
.qp-items-table th:nth-child(3), .qp-items-table td:nth-child(3){ width:9%; text-align:right; font-family:'Consolas','SF Mono','Courier New',monospace; padding-right:6px; }
.qp-items-table th:nth-child(4), .qp-items-table td:nth-child(4){ width:19%; text-align:right; font-family:'Consolas','SF Mono','Courier New',monospace; padding-right:6px; }
.qp-items-table th:nth-child(5), .qp-items-table td:nth-child(5){ width:26%; text-align:right; font-family:'Consolas','SF Mono','Courier New',monospace; padding-right:6px; }
.qp-table td.num, .qp-table th.num{ text-align:right; font-family:'Consolas','SF Mono','Courier New',monospace; padding-right:6px; }
.qp-table tbody tr:last-child td{ border-bottom:1px solid #12233f; }
.qp-totals{ width:280px; margin-left:auto; margin-top:10px; padding-top:10px; border-top:2px solid #12233f; }
.qp-totals .qp-row{ display:flex; justify-content:space-between; padding:5px 0; font-size:12.5px; border-bottom:1px solid #eee; }
.qp-totals .qp-row span:last-child{ font-family:'Consolas','SF Mono','Courier New',monospace; }
.qp-totals .qp-row.grand{ font-weight:700; font-size:15px; color:#12233f; border-top:2px solid #12233f; border-bottom:none; padding-top:8px; margin-top:4px; }
.qp-words{ font-size:11.5px; color:#444; font-style:italic; margin-top:10px; }
.qp-legal{ margin-top:24px; padding-top:16px; }
.qp-signblock{ margin-top:auto; padding-top:20px; }
.qp-terms-row{ display:flex; gap:32px; }
.qp-terms{ margin-top:0; font-size:11px; color:#444; flex:1.3; }
.qp-bank{ font-size:11px; color:#444; flex:1; }
.qp-bank .qp-label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#12233f; font-weight:700; margin-bottom:5px; }
.qp-bank .qp-bank-row{ display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dotted #ddd; }
.qp-bank .qp-bank-row span:first-child{ color:#888; font-weight:400; }
.qp-bank .qp-bank-row span:last-child{ font-weight:400; color:#111; text-align:right; }
.qp-terms .qp-label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#12233f; font-weight:700; margin-bottom:5px; }
.qp-terms ol{ margin:0; padding-left:16px; line-height:1.7; }
.qp-sign{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:0; }
.qp-sign .qp-for{ font-size:12px; }
.qp-sign .qp-line{ margin-top:32px; border-top:1px solid #333; padding-top:6px; font-size:11px; width:200px; text-align:center; }
.qp-foot{ margin-top:10px; padding-top:7px; border-top:1px solid #ccc; font-size:10px; color:#888; text-align:center; line-height:1.7; }

/* ===== Pay Slip grid layout ===== */
.ps-head{ text-align:center; }
.ps-co-name{ font-weight:700; font-size:15px; color:#111; letter-spacing:.3px; }
.ps-co-sub{ font-size:10.5px; color:#555; margin-top:3px; line-height:1.6; }
.ps-co-sub a{ color:#2563a8; }
.ps-title{ text-align:center; font-size:16px; font-weight:700; color:#12233f; letter-spacing:1px; margin:14px 0; }
.ps-grid{ width:100%; border-collapse:collapse; margin-bottom:10px; }
.ps-grid td{ border:1px solid #999; padding:4px 8px; font-size:11.5px; vertical-align:middle; }
.ps-grid td.lbl{ font-weight:700; background:#fbf2d9; width:16%; }
.ps-grid td.val{ width:34%; }
.ps-bar{ background:#dbe6f3; text-align:center; font-weight:700; font-size:11.5px; padding:5px; border:1px solid #999; letter-spacing:.5px; }
.ps-att{ width:100%; border-collapse:collapse; margin-bottom:10px; }
.ps-att td{ border:1px solid #999; padding:4px 8px; font-size:11.5px; }
.ps-att td.lbl{ font-weight:700; width:25%; }
.ps-att td.val{ width:25%; text-align:right; font-family:'Consolas','SF Mono','Courier New',monospace; }
.ps-earn{ width:100%; border-collapse:collapse; }
.ps-earn th{ background:#dbe6f3; border:1px solid #999; padding:5px 8px; font-size:11px; text-align:left; }
.ps-earn th.num{ text-align:right; }
.ps-earn td{ border:1px solid #999; padding:4px 8px; font-size:11.5px; }
.ps-earn td.num{ text-align:right; font-family:'Consolas','SF Mono','Courier New',monospace; }
.ps-earn tr.total td{ font-weight:700; }
.ps-earn tr.net td{ font-weight:700; background:#dcecd8; }
.ps-earn tr.spacer td{ border:none; padding:3px; }
.ps-earn tbody tr:last-child td{ border-bottom:2px solid #12233f; }
.ps-att tbody tr:last-child td{ border-bottom:1px solid #999; }
.ps-grid tbody tr:last-child td{ border-bottom:1px solid #999; }
.ps-payable{ font-weight:700; font-size:12px; margin-top:10px; }
.ps-words{ background:#dbe6f3; font-weight:700; font-size:11.5px; padding:6px 8px; margin-top:4px; }
.ps-sign-row{ display:flex; margin-top:60px; }
.ps-sign-box{ flex:1; border:1px solid #999; padding:10px 8px 8px; min-height:50px; display:flex; align-items:flex-end; font-weight:700; font-size:11.5px; }
.ps-sign-box.mid{ flex:0.6; border-left:none; border-right:none; }


@media print{
  *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}
  .print-only{visibility:visible !important;}
}

.claim-print{
  width:210mm; min-height:270mm; box-sizing:border-box;
  padding:14mm; background:#fff; color:#111; font-family:Arial,sans-serif;
}
.claim-print-head{
  display:flex; justify-content:space-between; align-items:flex-start;
  border-bottom:2px solid #12233f; padding-bottom:10px; margin-bottom:14px;
}
.claim-brand{display:flex; gap:10px; align-items:center;}
.claim-brand img{width:62px;height:auto;}
.claim-company{font-size:16px;font-weight:700;color:#12233f;}
.claim-sub{font-size:8.5pt;color:#555;line-height:1.35;}
.claim-title{font-size:18px;font-weight:700;letter-spacing:1.5px;color:#12233f;padding-top:6px;}
.claim-meta{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #bbb;margin-bottom:16px;}
.claim-meta div{padding:8px;border-right:1px solid #ddd;}
.claim-meta div:last-child{border-right:0;}
.claim-meta b,.claim-grid b{display:block;font-size:8pt;color:#666;text-transform:uppercase;margin-bottom:4px;}
.claim-meta span,.claim-grid span{font-size:10.5pt;}
.claim-section{border:1px solid #ddd;margin-bottom:14px;padding:10px;}
.claim-section h3{margin:0 0 9px;color:#12233f;font-size:11pt;}
.claim-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.claim-wide{grid-column:1/-1;}
.claim-total{display:flex;justify-content:space-between;border-top:2px solid #12233f;border-bottom:1px solid #ccc;padding:10px 4px;font-size:13pt;}
.claim-sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:60px;text-align:center;}
.claim-sign div{border-top:1px solid #555;padding-top:7px;font-size:9pt;}
@media print{
  .claim-print{display:block !important;}
}

.claim-preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.claim-preview-grid>div{padding:8px;border-bottom:1px solid #ddd}
.claim-preview-grid b,.claim-preview-block>b{display:block;font-size:9px;color:#777;margin-bottom:3px}
.claim-preview-block{padding:9px 0;border-bottom:1px solid #e5e5e5}
.claim-preview-total{display:flex;justify-content:space-between;padding:13px 0;font-size:16px}

#sameTabPrint{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  overflow:auto;
  background:#fff;
}
#sameTabPrintControls{
  position:sticky;
  top:0;
  z-index:2;
  padding:12px 14px;
  background:#fff;
  border-bottom:1px solid #ddd;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}
#sameTabPrintContent{
  width:210mm;
  min-height:297mm;
  margin:0 auto;
  background:#fff;
}
@media(max-width:700px){
  #sameTabPrintContent{width:100%; min-height:0;}
}
  body.same-tab-printing #sameTabPrint{display:block !important;position:static !important;overflow:visible !important;}
  body.same-tab-printing #sameTabPrintContent{padding:0 !important;}
  @page{size:A4;margin:0;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark"><img id="brandLogo" src="" alt="Anushka Computech logo"></div>

/* Indian-system number to words, e.g. 177236 -> "One Lakh Seventy Seven Thousand Two Hundred Thirty Six" */
function numberToWordsIndian(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'Zero';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){
    if(n<20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
  }
  function three(n){
    if(n<100) return two(n);
    return ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' + two(n%100) : '');
  }
  const crore = Math.floor(num / 10000000); num %= 10000000;
  const lakh = Math.floor(num / 100000); num %= 100000;
  const thousand = Math.floor(num / 1000); num %= 1000;
  const rest = num;
  let parts = [];
  if(crore) parts.push(three(crore) + ' Crore');
  if(lakh) parts.push(three(lakh) + ' Lakh');
  if(thousand) parts.push(three(thousand) + ' Thousand');
  if(rest) parts.push(three(rest));
  return parts.join(' ');
}

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function calcEntry(e){
  const gr = DB.meta.gstRate;
  const salesTaxable = (Number(e.salesQty)||0) * (Number(e.salesRate)||0);
  const outputGst = salesTaxable * gr;
  const salesInvoiceTotal = salesTaxable + outputGst;
  const purTaxable = (Number(e.purQty)||0) * (Number(e.purRate)||0);
  const inputGst = purTaxable * gr;
  const purInvoiceTotal = purTaxable + inputGst;
  const promoCost = ((Number(e.promoPct)||0)/100) * salesInvoiceTotal;
  const grossProfit = salesTaxable - purTaxable;
  const netGst = outputGst - inputGst;
  const earningsBeforeSalary = grossProfit - promoCost;
  return {salesTaxable, outputGst, salesInvoiceTotal, purTaxable, inputGst, purInvoiceTotal, promoCost, grossProfit, netGst, earningsBeforeSalary};
}

/* Attendance Time Log — mirrors the workbook's exact formulas.
   Check-out is fixed at 18:30 (as in the sheet); only Check-In is entered. */
function timeToDec(t){ // "HH:MM" -> decimal hours
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h + m/60;
}
function computeTimeLog(checkIn){
  const FIXED_OUT = 18.5; // 18:30
  if(!checkIn) return { hoursWorked:'', attStatus:'Absent', overtime:'', phaStatus:'A' };
  const ci = timeToDec(checkIn);
  const hoursWorked = ci > 11.0 ? 0 : (((FIXED_OUT - ci) % 24 + 24) % 24);
  const attStatus = ci <= 10.0 ? 'On Time' : ci <= 10.25 ? 'Late' : ci <= 11.0 ? 'Half Day' : 'Absent';
  const overtime = ci > 10.25 ? 0 : Math.max(0, hoursWorked - 8.5);
  const phaStatus = ci <= 10.25 ? 'P' : ci <= 11.0 ? 'H' : 'A';
  return { hoursWorked, attStatus, overtime, phaStatus };
}
function decToTimeLabel(h){
  if(h==='' || h==null) return '—';
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return hh + 'h ' + mm + 'm';
}

function salaryExpenseForDate(date){
  // only counts if that date has at least one entry with sales
  const hasSales = DB.entries.some(e => e.date===date && (Number(e.salesQty)||0)>0);
  if(!hasSales) return 0;
  let total=0;
  DB.attendance.filter(a=>a.date===date).forEach(a=>{
    const emp = DB.employees.find(x=>x.id===a.empId);
    if(!emp) return;
    const factor = a.status==='P'?1: a.status==='H'?0.5:0;
    total += (Number(emp.salary)||0)/DB.meta.workingDays * factor;
  });
  return total;
}

function monthlyReport(){
  const months = {};
  DB.entries.forEach(e=>{
    const m = entryMonth(e); if(!m) return;
    const c = calcEntry(e);
    months[m] = months[m] || {salesTaxable:0,purchaseTaxable:0,outputGst:0,inputGst:0,promoCost:0,grossProfit:0};
    months[m].salesTaxable += c.salesTaxable;
    months[m].purchaseTaxable += c.purTaxable;
    months[m].outputGst += c.outputGst;
    months[m].inputGst += c.inputGst;
    months[m].promoCost += c.promoCost;
    months[m].grossProfit += c.grossProfit;
  });
  // salary per date, grouped into month
  const dateSet = new Set(DB.entries.map(e=>e.date).filter(Boolean));
  dateSet.forEach(d=>{
    const m = d.slice(0,7);
    const sal = salaryExpenseForDate(d);
    if(!months[m]) return;
    months[m].salaryExpense = (months[m].salaryExpense||0) + sal;
  });
  const rows = Object.keys(months).sort().map(m=>{
    const r = months[m];
    const netGst = r.outputGst - r.inputGst;
    const salaryExpense = r.salaryExpense||0;
    const netEarnings = r.grossProfit - r.promoCost - salaryExpense;
    const cashAfterGst = netEarnings - netGst;
    const netMargin = r.salesTaxable ? netEarnings / r.salesTaxable : null;
    return {month:m, ...r, netGst, salaryExpense, netEarnings, cashAfterGst, netMargin};
  });
  return rows;
}

function bankLedger(){
  const ledger = {};
  DB.meta.accounts.forEach(a=> ledger[a] = { opening: DB.meta.opening[a]||0, txns:[] });
  DB.entries.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(e=>{
    const c = calcEntry(e);
    const acc = e.sourceAccount;
    if(!acc || !ledger[acc]) return;
    if(c.salesInvoiceTotal>0 && e.custStatus==='RECEIVED'){
      ledger[acc].txns.push({date:e.date, desc:e.item||'Sale', type:'Credit', amount:c.salesInvoiceTotal});
    }
    if(c.purInvoiceTotal>0 && e.vendStatus==='PAID'){
      ledger[acc].txns.push({date:e.date, desc:e.item||'Purchase', type:'Debit', amount:c.purInvoiceTotal});
    }
  });
  Object.keys(ledger).forEach(acc=>{
    let bal = ledger[acc].opening;
    ledger[acc].txns.forEach(t=>{ bal += (t.type==='Credit'? t.amount : -t.amount); t.balance = bal; });
    ledger[acc].closing = bal;
  });
  return ledger;
}

/* ---- Annual Register: combined sales+purchase lines from Daily Entry ---- */
function annualRegisterRows(year){
  const rows = [];
  DB.entries.filter(e=>(e.date||'').startsWith(String(year))).forEach(e=>{
    const c = calcEntry(e);
    if((Number(e.salesQty)||0)>0){
      rows.push({type:'Sales', date:e.date, item:e.item, nature:e.nature, qty:e.salesQty, rate:e.salesRate, taxable:c.salesTaxable, gst:c.outputGst, invoiceTotal:c.salesInvoiceTotal, paymentStatus:e.custStatus, account:e.sourceAccount});
    }
    if((Number(e.purQty)||0)>0){
      rows.push({type:'Purchase', date:e.date, item:e.item, nature:e.nature, qty:e.purQty, rate:e.purRate, taxable:c.purTaxable, gst:c.inputGst, invoiceTotal:c.purInvoiceTotal, paymentStatus:e.vendStatus, account:e.sourceAccount});
    }
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let bal = DB.meta.opening[DB.meta.accounts[0]]||0;
  rows.forEach(r=>{
    const settled = (r.type==='Sales' && r.paymentStatus==='RECEIVED') || (r.type==='Purchase' && r.paymentStatus==='PAID');
    r.bankAmount = settled ? (r.type==='Sales'? r.invoiceTotal : -r.invoiceTotal) : 0;
    bal += r.bankAmount;
    r.runningBalance = bal;
  });
  return rows;
}

/* ---- Daily Attendance monthly grid (built from DB.attendance) ---- */
function daysInGridMonth(year, month){ return new Date(year, month, 0).getDate(); } // month 1-12
function attendanceGrid(year, month){
  const dim = daysInGridMonth(year, month);
  const attIndex = {};
  DB.attendance.forEach(a => { attIndex[a.date+'|'+a.empId] = a.status; });
  return DB.employees.filter(x=>x.status!=='Inactive').map(emp=>{
    const days = [];
    let present=0, half=0, absent=0;
    for(let d=1; d<=dim; d++){
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(isSunday(dateStr)){ days.push('Sun'); continue; }
      const st = attIndex[dateStr+'|'+emp.id] || '';
      days.push(st);
      if(st==='P') present+=1;
      else if(st==='H'){ half+=1; }
      else if(st==='A') absent+=1;
    }
    const paidDays = present + half*0.5;
    const salaryExpense = (emp.salary/DB.meta.workingDays) * paidDays;
    return { emp, days, present, half, absent, paidDays, salaryExpense };
  });
}

/* ---- Advances & Claims (unified register; approved claims settle advance balance) ---- */
function advanceBalances(){
  const bal = {};
  DB.employees.forEach(e=> bal[e.id] = {opening:0, advances:0, claims:0, balance:0});
  DB.advances.forEach(a=>{
    if(!bal[a.empId]) return;
    const amt = a.approvalStatus==='Approved' ? (Number(a.approvedAmount ?? a.amount)||0) : 0;
    if(a.type==='Advance') bal[a.empId].advances += amt;
    else bal[a.empId].claims += amt;
  });
  Object.keys(bal).forEach(id=>{ bal[id].balance = bal[id].advances - bal[id].claims; });
  return bal;
}

/* ---- Payroll ---- */
function payrollForMonth(year, month){
  const dim = 30; // per workbook note: payroll uses days 1-30 only
  const grid = attendanceGrid(year, month).map(g=>{
    // recompute paid days capped to 30-day basis (exclude day31 effect already since grid loop used dim which may be >30; clamp)
    return g;
  });
  const bal = advanceBalances();
  return DB.employees.filter(x=>x.status!=='Inactive').map(emp=>{
    const g = grid.find(x=>x.emp.id===emp.id) || {present:0,half:0,absent:0,paidDays:0};
    const paidDays = Math.min(g.paidDays, dim);
    const earned = (emp.salary/dim) * paidDays;
    const monthStr = `${year}-${String(month).padStart(2,'0')}`;
    const advDeduction = DB.advances.filter(a=>a.empId===emp.id && a.type==='Advance' && a.deductFromSalary && a.approvalStatus==='Approved' && (a.date||'').startsWith(monthStr))
      .reduce((s,a)=>s+(Number(a.approvedAmount ?? a.amount)||0),0);
    const netPayable = Math.max(0, earned - advDeduction);
    const rec = DB.payroll.find(p=>p.empId===emp.id && p.month===monthStr);
    return { emp, present:g.present, half:g.half, absent:g.absent, paidDays, earned, advDeduction, netPayable, status: rec ? rec.status : 'Pending', monthStr };
  });
}

function showSameTabPrint(html){
  const wrap=document.getElementById('sameTabPrint');
  const content=document.getElementById('sameTabPrintContent');
  const printBtn=document.getElementById('sameTabPrintBtn');
  const backBtn=document.getElementById('sameTabBack');
  if(!wrap||!content||!printBtn||!backBtn){
    toast('Print preview is not available');
    return;
  }
  content.innerHTML=html;
  wrap.style.display='block';
  wrap.setAttribute('aria-hidden','false');
  document.body.classList.add('same-tab-printing');
  printBtn.onclick=async (e)=>{
    e.preventDefault();
    e.stopPropagation();
    // Native print first. On iPhone/Safari this can be ignored; in that case
    // the same button falls back to generating a real A4 PDF.
    let printReturned = false;
    const onAfterPrint = () => { printReturned = true; };
    window.addEventListener('afterprint', onAfterPrint, {once:true});
    try { window.focus(); window.print(); } catch(err) {}
    // If Safari does not open its print UI, create a PDF from the exact preview.
    setTimeout(async ()=>{
      if(printReturned) return;
      try {
        if(typeof html2pdf !== 'function') throw new Error('PDF engine unavailable');
        const src=document.getElementById('sameTabPrintContent');
        if(!src) throw new Error('Print content unavailable');
        const clone=src.cloneNode(true);
        clone.style.width='210mm';
        clone.style.minHeight='297mm';
        clone.style.background='#fff';
        clone.style.position='fixed';
        clone.style.left='-100000px';
        clone.style.top='0';
        clone.style.padding='0';
        clone.style.margin='0';
        document.body.appendChild(clone);
        const opt={
          margin:0,
          filename:'Anushka-Computech-Document.pdf',
          image:{type:'jpeg',quality:0.98},
          html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false},
          jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
        };
        const blob=await html2pdf().set(opt).from(clone).outputPdf('blob');
        clone.remove();
        const url=URL.createObjectURL(blob);
        window.location.href=url;
        setTimeout(()=>URL.revokeObjectURL(url),60000);
      } catch(err) {
        toast('PDF could not be created. Please use Safari Share → Print.');
      }
    }, 1200);
  };
  backBtn.onclick=hideSameTabPrint;
  window.scrollTo(0,0);
}
function hideSameTabPrint(){
  const wrap=document.getElementById('sameTabPrint');
  if(wrap){ wrap.style.display='none'; wrap.setAttribute('aria-hidden','true'); }
  const content=document.getElementById('sameTabPrintContent');
  if(content) content.innerHTML='';
  document.body.classList.remove('same-tab-printing');
}
window.showSameTabPrint=showSameTabPrint;

  return poEntries(po.id).reduce((sum,e)=>sum+Number(calcEntry(e).salesTaxable||0),0);

function poBalance(po){
  const total=Math.max(0,Number(po.poValue||0));

async function loadExternalScript(src){
  if(document.querySelector(`script[src="${src}"]`)) return;
  await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src=src;sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc);});
}
function setPOField(id,value){const el=document.getElementById(id); if(el && value!=null && String(value).trim()) el.value=String(value).trim();}
function parsePODate(v){
  if(!v)return '';
  let m=String(v).match(/(\d{1,2})[-\/ ]([A-Za-z]{3,9}|\d{1,2})[-\/ ](\d{2,4})/);
  if(!m)return '';
  const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  let d=+m[1], mon=isNaN(+m[2])?months[String(m[2]).slice(0,3).toLowerCase()]:+m[2], y=+m[3]; if(y<100)y+=2000;
  if(!mon||d<1||d>31)return ''; return `${y}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function extractPOFields(text){
  // Import only the fields that exist in our final PO form.
  // Do not copy unrelated fields such as Party No., Amendment No., Order No., CIN, IEC, FSSAI, etc.
  const t=String(text||'').replace(/\r/g,'');
  const lines=t.split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  const out={poNo:'',date:'',customer:'',customerGstin:'',customerAddress:'',paymentTerms:'',transportation:'',deliveryTerms:'',taxType:'',totalAmount:0,items:[]};
  const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const parseDate=(v)=>{
    const m=String(v||'').match(/(\d{1,2})[-\/ ]([A-Za-z]{3,9}|\d{1,2})[-\/ ](\d{2,4})/);
    if(!m)return '';
    let d=+m[1], mo=isNaN(+m[2])?months[String(m[2]).slice(0,3).toLowerCase()]:+m[2], y=+m[3];
    if(y<100)y+=2000;
    return mo&&d>=1&&d<=31?`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`:'';
  };
  // PO No: prefer explicit PURCHASE ORDER number / PO No; for this common format use the Order No value only as PO No.
  let m=t.match(/(?:Purchase\s+Order\s*(?:No\.?|Number)?|PO\s*(?:No\.?|Number)?)\s*[:#-]?\s*([A-Z0-9][A-Z0-9\/-]{5,})/i);
  if(m) out.poNo=m[1].trim();
  if(!out.poNo){
    m=t.match(/Order\s+No\.?\s*[:.]\s*([A-Z0-9][A-Z0-9\/-]{5,})/i);
    if(m) out.poNo=m[1].trim();
  }
  // PO date: use PO Date if present, otherwise Order Date (same business meaning in our app).
  m=t.match(/(?:PO\s*Date|Purchase\s*Order\s*Date|Order\s*Date)\s*[:.]?\s*(\d{1,2}[-\/ ](?:[A-Za-z]{3,9}|\d{1,2})[-\/ ]\d{2,4})/i);
  if(m) out.date=parseDate(m[1]);

  // Identify the customer from the PO issuer/customer block. Do not import any address.
  const poHead=lines.findIndex(x=>/PURCHASE\s+ORDER/i.test(x));
  const companyRe=/(PRIVATE LIMITED|PVT\.?\s*LTD\.?|LIMITED|LTD\.?|LLP|ENTERPRISES|INDUSTRIES|TECHNOLOGIES|CORPORATION|COMPANY|BEVERAGES)/i;
  if(poHead>=0){
    const pre=lines.slice(0,poHead);
    // Prefer a company name immediately before the GSTIN in the issuer block.
    const gi=pre.findIndex(x=>/GST\s*(?:No|IN)|GSTIN/i.test(x));
    if(gi>=0){
      for(let i=gi-1;i>=0;i--){
        if(companyRe.test(pre[i]) && !/ANUSHKA\s+COMPUTECH/i.test(pre[i])){ out.customer=pre[i].trim(); break; }
      }
    }
    if(!out.customer){
      for(let i=pre.length-1;i>=0;i--){
        if(companyRe.test(pre[i]) && !/ANUSHKA\s+COMPUTECH/i.test(pre[i])){ out.customer=pre[i].trim(); break; }
      }
    }
  }
  // Customer GSTIN: take the GSTIN from the issuer/customer block before the supplier details.
  if(poHead>=0){
    const pre=lines.slice(0,poHead).join('\n');
    const gm=pre.match(/(?:GSTIN\s*No\.?|GSTIN|GST\s*No\.?)\s*[:.]?\s*([0-9A-Z]{15})/i);
    if(gm) out.customerGstin=gm[1].toUpperCase();
  }
  // Fallback: first GSTIN in the PO.
  if(!out.customerGstin){ const gm=t.match(/(?:GSTIN\s*No\.?|GSTIN|GST\s*No\.?)\s*[:.]?\s*([0-9A-Z]{15})/i); if(gm) out.customerGstin=gm[1].toUpperCase(); }

  const bounded=(label,nextLabels)=>{
    const re=new RegExp(label+'\s*[:.]\s*(.*?)(?=\s+(?:'+nextLabels.join('|')+')\s*[:.]|$)','i');
    const z=t.match(re);
    return z?z[1].replace(/\s+/g,' ').trim():'';
  };
  out.paymentTerms=bounded('Payment\s*Terms?',['Delivery\s*Schedule','Delivery\s*Address','Billing\s*Address','Transportation','Rejection','Penalty\s*Clause','Insurance','Enclosures','Jurisdiction','Note','Additional\s*Notes','Delivery\s*Terms']);
  out.transportation=bounded('Transportation',['Rejection','Penalty\s*Clause','Insurance','Enclosures','Jurisdiction','Note','Additional\s*Notes','Delivery\s*Terms','Amount\s*In\s*Words','IGST','CGST','SGST','Total\s*Amount']);
  out.deliveryTerms=bounded('Delivery\s*Terms?',['Delivery\s*Address','Billing\s*Address','Transportation','Rejection','Penalty\s*Clause','Insurance','Enclosures','Jurisdiction','Note','Additional\s*Notes','Amount\s*In\s*Words','IGST','CGST','SGST','Total\s*Amount']);
  const ig=t.match(/\b(IGST|CGST\s*\+?\s*SGST|CGST|SGST)\s*(?:@)?\s*(\d+(?:\.\d+)?)%/i);
  if(ig){
    const kind=ig[1].replace(/\s+/g,'').toUpperCase();
    out.taxType=(kind.includes('CGST')||kind.includes('SGST')?'CGST+SGST ':kind+' ')+ig[2]+'%';
  }
  const tm=t.match(/Total\s+Amount\s*[:.]?\s*(?:INR\s*)?([0-9,]+(?:\.\d+)?)/i); if(tm) out.totalAmount=Number(tm[1].replace(/,/g,''));

  // Item extraction: use the PO's actual tabular columns. Handles wrapped descriptions.
  const flat=lines.join(' ').replace(/\s+/g,' ');
  const itemRe=/\b([A-Z]{1,12}\d{3,})\s+(.+?)\s+(No|Nos|PCS|PC|MTR|Meter|Meters|Core|Point|Job|Set|Box|Unit)\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+([\d,]+(?:\.\d+)?)\s+([\d,]+(?:\.\d+)?)\s+([\d,]+(?:\.\d+)?)(?=\s+(?:Basic\s+Total|Taxes\s*&\s*Duties|Payment\s+Terms|Delivery\s+Schedule|Delivery\s+Address|Billing\s+Address|Transportation|Rejection|Penalty\s+Clause|Insurance|Enclosures|Jurisdiction|Note\s*:|Additional\s+Notes|Delivery\s+Terms|Amount\s+In\s+Words|IGST|CGST|Total\s+Amount|$))/i;
  let im=itemRe.exec(flat);
  if(im){
    out.items.push({sno:1,itemCode:im[1],description:im[2].trim(),style:'',unit:im[3],qty:Number(im[4]),rate:Number(im[5]),basicAmount:Number(im[6].replace(/,/g,'')),discount:Number(im[7].replace(/,/g,'')),lineAmount:Number(im[8].replace(/,/g,'')),taxType:out.taxType||'GST 0%'});
  }
  // Generic fallback for POs where item code is absent but the numeric tail is the same.
  if(!out.items.length){
    const generic=/\b(\d{1,4})\s+(.+?)\s+(No|Nos|PCS|PC|MTR|Meter|Meters|Core|Point|Job|Set|Box|Unit)\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+([\d,]+(?:\.\d+)?)\s+([\d,]+(?:\.\d+)?)\s+([\d,]+(?:\.\d+)?)(?=\s+(?:Basic\s+Total|Taxes\s*&\s*Duties|Payment\s+Terms|Delivery\s+Schedule|Delivery\s+Address|Billing\s+Address|Transportation|Rejection|Penalty\s+Clause|Insurance|Enclosures|Jurisdiction|Note\s*:|Additional\s+Notes|Delivery\s+Terms|Amount\s+In\s+Words|IGST|CGST|Total\s+Amount|$))/i;
    const g=generic.exec(flat);
    if(g) out.items.push({sno:Number(g[1]),itemCode:'',description:g[2].trim(),style:'',unit:g[3],qty:Number(g[4]),rate:Number(g[5]),basicAmount:Number(g[6].replace(/,/g,'')),discount:Number(g[7].replace(/,/g,'')),lineAmount:Number(g[8].replace(/,/g,'')),taxType:out.taxType||'GST 0%'});
  }
  return out;
}

async function importPOFile(file){
  if(!file)return;
  showOriginalPOPreview(file);
  const setImportStatus=(msg,ok=false)=>{
    const el=document.getElementById('po_import_status');
    if(el){el.textContent=msg;el.style.color=ok?'var(--green)':'var(--muted)';}
  };
  try{
    setImportStatus(`Reading PO: ${file.name}…`);
    toast('Reading PO…');
    let text='';
    if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){
      // Use PDF.js as an ES module. Do not load the .mjs file as a classic script.
      const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
      const buf=await file.arrayBuffer();
      const pdf=await pdfjs.getDocument({data:buf}).promise;
      const pages=[];
      for(let i=1;i<=pdf.numPages;i++){
        const pg=await pdf.getPage(i);
        const c=await pg.getTextContent();
        pages.push(c.items.map(x=>x.str||'').join(' '));
      }
      text=pages.join('\n');
      // Scanned/image-only PDFs may have little or no text layer. Fall back to OCR.
      if(text.trim().length < 80){
        setImportStatus('PDF has no usable text layer. Starting OCR…');
        await loadExternalScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
        const ocrPages=[];
        for(let i=1;i<=pdf.numPages;i++){
          const pg=await pdf.getPage(i);
          const viewport=pg.getViewport({scale:2});
          const canvas=document.createElement('canvas');
          canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
          const ctx=canvas.getContext('2d');
          await pg.render({canvasContext:ctx,viewport}).promise;
          const res=await Tesseract.recognize(canvas,'eng',{
            logger:m=>{
              if(m.status==='recognizing text'&&m.progress>.1){
                const p=Math.round(m.progress*100);
                setImportStatus(`OCR page ${i}/${pdf.numPages}: ${p}%…`);
              }
            }
          });
          ocrPages.push(res.data.text||'');
        }
        text=ocrPages.join('\n');
      }
    }else if(file.type.startsWith('image/')){
      await loadExternalScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      const res=await Tesseract.recognize(file,'eng',{
        logger:m=>{
          if(m.status==='recognizing text'&&m.progress>.1){
            const p=Math.round(m.progress*100);
            toast('Reading PO '+p+'%');
            setImportStatus('Reading image '+p+'%…');
          }
        }
      });
      text=res.data.text||'';
    }else{
      setImportStatus('Please upload a PDF or image.');
      toast('Please upload a PDF or image.');
      return;
    }

    const data=extractPOFields(text);

    setPOField('po_no',data.poNo);
    setPOField('po_date',data.date);
    setPOField('po_customer',data.customer);
    setPOField('po_customer_gstin',data.customerGstin);
    setPOField('po_payment_terms',data.paymentTerms);
    setPOField('po_transportation',data.transportation);
    setPOField('po_delivery_terms',data.deliveryTerms);

    if(data.items?.length){
      const tb=document.querySelector('#po_lines tbody');
      if(tb){
        tb.innerHTML='';
        data.items.forEach((x,i)=>{
          const tr=document.createElement('tr');
          tr.dataset.id=uid();
          tr.innerHTML=`<td>${i+1}</td>
            <td><input class="po-li-code" value="${esc(x.itemCode||'')}" placeholder="Item Code"></td>
            <td><input class="po-li-desc" value="${esc(x.description||'')}" placeholder="Description"></td>
            <td><input class="po-li-style" value="${esc(x.style||'')}" placeholder="Style"></td>
            <td><input class="po-li-unit" value="${esc(x.unit||'')}" placeholder="UOM"></td>
            <td><input class="po-li-qty num" type="number" min="0" step="0.01" value="${Number(x.qty||0)}"></td>
            <td><input class="po-li-rate num" type="number" min="0" step="0.01" value="${Number(x.rate||0)}"></td>
            <td><input class="po-li-discount num" type="number" min="0" step="0.01" value="${Number(x.discount||0)}"></td>
            <td><select class="po-li-tax">
              <option>GST 0%</option><option>IGST 5%</option><option>IGST 12%</option><option>IGST 18%</option><option>IGST 28%</option><option>CGST+SGST 5%</option><option>CGST+SGST 12%</option><option>CGST+SGST 18%</option><option>CGST+SGST 28%</option><option>Exempt</option>
            </select></td>
            <td class="po-li-total num">₹0.00</td>
            <td><button type="button" class="btn-ghost btn-sm" onclick="removePOLine(this)">×</button></td>`;
          tb.appendChild(tr);
          const sel=tr.querySelector('.po-li-tax');
          const rateMatch=String(data.taxType||'').match(/(IGST|CGST\+SGST|GST)?\s*(\d+(?:\.\d+)?)%/i);
          if(sel&&rateMatch){
            const prefix=(rateMatch[1]||'GST').toUpperCase();
            const target=prefix+' '+rateMatch[2]+'%';
            if(Array.from(sel.options).some(o=>o.value===target)) sel.value=target;
          }
        });
        bindPOLineEvents();
      }
    }else{
      // Keep the manually entered/default line when the document has no reliably parsed item table.
      setImportStatus('Header details read. Please enter/verify PO line items manually.');
      toast('PO header read. Please verify and complete line items.');
      return;
    }

    recalcPOForm();
    setImportStatus(`PO details extracted (${data.items.length} line${data.items.length===1?'':'s'}). Please verify before saving.`,true);
    toast('PO details extracted. Please verify all fields and line items before saving.');
  }catch(e){
    console.error(e);
    setImportStatus('Could not read this PO. Please verify details manually.');
    toast('Could not read this PO. Please enter/verify details manually.');
  }
}

    <div class="hint">For PO-linked work, select the task to see assigned and remaining quantity. Enter only the quantity completed today. Rate and Sales Amount are not shown to employees.</div>
    <label>Work Description</label><textarea id="sr_desc" rows="4" placeholder="Describe the completed service work"></textarea>
    <label>Remarks</label><textarea id="sr_remarks" rows="2"></textarea>

    <div class="btn-row"><button class="btn-primary" onclick="submitServiceReport()">Submit Service Report</button><button class="btn-ghost" onclick="closeModal()">Cancel</button></div>`);

}
function loadServicePOForReport(){
  const po=servicePOs().find(p=>p.id===document.getElementById('sr_po')?.value);
  const info=document.getElementById('sr_po_info');
  const wrap=document.getElementById('sr_task_wrap');
  const sel=document.getElementById('sr_po_line');
  const taskInfo=document.getElementById('sr_task_info');
  if(!po){
    if(info) info.textContent='';
    if(wrap) wrap.style.display='none';
    if(taskInfo) taskInfo.style.display='none';
    if(sel) sel.innerHTML='<option value="">Select PO Task</option>';
    return;
  }
  if(document.getElementById('sr_customer')) document.getElementById('sr_customer').value=po.customer||'';
  if(document.getElementById('sr_project')) document.getElementById('sr_project').value=po.project||'';
  if(info) info.textContent=`${po.customer||''} · ${po.project||''} · PO ${po.poNo||''} · ${poStatus(po)}`;
  const lines=servicePOLinesWithRemaining(po);
  if(sel) sel.innerHTML='<option value="">Select PO Task</option>'+lines.filter(x=>x.remaining>0).map(x=>`<option value="${esc(x.id)}">${esc(x.description||'Task')} — Assigned ${fmt2(x.qty)} ${esc(serviceUnitLabel(x.unit||po.unit||'Nos'))} — Remaining ${fmt2(x.remaining)} ${esc(serviceUnitLabel(x.unit||po.unit||'Nos'))}</option>`).join('');
  if(wrap) wrap.style.display=lines.some(x=>x.remaining>0)?'block':'none';
  if(taskInfo){taskInfo.style.display='block';taskInfo.textContent=lines.length?lines.map(x=>`${x.description||'Task'}: Assigned ${fmt2(x.qty)} ${serviceUnitLabel(x.unit||po.unit||'Nos')}, Remaining ${fmt2(x.remaining)} ${serviceUnitLabel(x.unit||po.unit||'Nos')}`).join(' · '):'No PO tasks available.';}
}
function loadServicePOLineForReport(){
  const po=servicePOs().find(p=>p.id===document.getElementById('sr_po')?.value);
  const line=po && poLineRows(po).find(x=>x.id===document.getElementById('sr_po_line')?.value);
  const taskInfo=document.getElementById('sr_task_info');
  if(!po || !line){if(taskInfo) taskInfo.style.display='none';return;}
  const remaining=servicePOLineRemaining(po,line);
  if(document.getElementById('sr_workType')) document.getElementById('sr_workType').value=line.description||'';
  if(document.getElementById('sr_unit')) document.getElementById('sr_unit').value=line.unit||po.unit||'Nos';
  if(taskInfo){taskInfo.style.display='block';taskInfo.textContent=`${line.description||'Task'} · Assigned: ${fmt2(line.qty)} ${serviceUnitLabel(line.unit||po.unit||'Nos')} · Remaining: ${fmt2(remaining)} ${serviceUnitLabel(line.unit||po.unit||'Nos')}`;}
}
function servicePORate(po, workType, poLineId){
  const lines=poLineRows(po);
  const byId=poLineId ? lines.find(x=>x.id===poLineId) : null;
  if(byId) return Number(byId.rate||0);
  const target=(workType||po.service||'').trim().toLowerCase();
  const matches=lines.filter(x=>(x.description||'').trim().toLowerCase()===target);
  const use=matches.length?matches:[lines[0]].filter(Boolean);
  return use.length ? Number(use[0].rate||0) : Number(po.rate||0);
}
function servicePOLineRemaining(po, line){
  if(!po || !line) return Math.max(0,Number(line?.qty||0));
  const used=serviceReports().filter(r=>r.poId===po.id && r.jobStatus!=='Cancelled' &&
    (r.poLineId===line.id || (!r.poLineId && (r.workType||'').trim().toLowerCase()===(line.description||'').trim().toLowerCase())))
    .reduce((sum,r)=>sum+Number(r.quantity||0),0);
  return Math.max(0,Number(line.qty||0)-used);
}
function servicePOLinesWithRemaining(po){
  return poLineRows(po).map(line=>({...line,remaining:servicePOLineRemaining(po,line)}));
}
async function submitServiceReport(){
  const empEl=document.getElementById('sr_emp'), emp=currentRole==='ADMIN'?(DB.employees||[]).find(e=>e.id===empEl?.value):employeeForUser();
  const po=servicePOs().find(p=>p.id===document.getElementById('sr_po')?.value);
  const poLineId=document.getElementById('sr_po_line')?.value||'';
  const status=document.getElementById('sr_job_status').value;
  const date=document.getElementById('sr_date').value||todayStr();
  const customer=document.getElementById('sr_customer').value.trim();
  const project=document.getElementById('sr_project').value.trim();
  const workType=document.getElementById('sr_workType').value.trim();
  const quantity=Number(document.getElementById('sr_qty').value||0);
  const unit=document.getElementById('sr_unit').value||po?.unit||'Nos';
  const description=document.getElementById('sr_desc').value.trim();
  const remarks=document.getElementById('sr_remarks').value.trim();
  const err=document.getElementById('sr_err');
  if(!emp){err.textContent='Employee is required.';return;}
  // A job may be completed before the customer issues a PO. In that case it is still a sale;
  // the report is flagged Pending PO and can be linked to a later PO by Admin.
  if(status==='Completed'&&po&&!poLineId){err.textContent='Please select the PO task / service being reported.';return;}
  if(!customer){err.textContent='Customer name is required.';return;}
  if(!workType){err.textContent='Service / Job name is required.';return;}
  if(quantity<=0){err.textContent="Today's completed quantity must be greater than 0.";return;}
  if(!description){err.textContent='Please enter the completed work description.';return;}
  if(po && status==='Completed'){
    const line=poLineRows(po).find(x=>x.id===poLineId);
    if(!line){err.textContent='Selected PO task not found.';return;}
    const remaining=servicePOLineRemaining(po,line);
    if(quantity>remaining+0.000001){err.textContent=`Quantity exceeds remaining ${fmt2(remaining)} ${serviceUnitLabel(line.unit||unit)} for this PO task.`;return;}
  }

  // A Service Report records actual quantity completed today. The employee never sees rate/amount.
  // Whether a PO exists or not, completed service is a Sales entry. If there is no PO yet,
  // it is marked Pending PO and can be linked later by Admin.
  const serviceReportId=uid();
  let autoEntryId='';
  if(status==='Completed' || status==='Completed Without PO'){
    const rate=po ? servicePORate(po,workType,poLineId) : serviceMasterRate(workType,unit);
    const amount=quantity*rate;
    if(rate<=0 || amount<=0){err.textContent='No positive service rate is configured for this service. Please ask Admin to set the Service Master rate.';return;}
    autoEntryId=uid();
    DB.entries=Array.isArray(DB.entries)?DB.entries:[];
    DB.entries.push({
      id:autoEntryId,date,item:workType,nature:'Service',poId:po?.id||'',poNo:po?.poNo||'',poType:po?'Service':'',
      salesQty:quantity,salesRate:rate,custStatus:'NOT RECEIVED',purQty:0,purRate:0,vendStatus:'PAID',
      promoPct:0,sourceAccount:(DB.meta?.accounts||['Main Account'])[0],
      serviceReportId:serviceReportId,serviceEmployeeId:emp.id,serviceEmployeeName:emp.name,serviceDescription:description,
      pendingPO:!po, pendingPOStatus:!po?'Pending PO':'Linked PO'
    });
    await saveKey('entries');
  }

  const serviceId=serviceReportId, submittedAt=new Date().toISOString();
  const rows=serviceReports();
  rows.push({id:serviceId,date,poId:po?.id||'',poNo:po?.poNo||'',poLineId:poLineId||'',customer,poProject:po?.project||project,empId:emp.id,empName:emp.name,project,location:customer,workType,quantity,unit,rate:0,salesAmount:0,jobStatus:status,description,remarks,autoEntryId,submittedAt});
  DB.serviceReports=rows;
  await saveKey('serviceReports');
  closeModal(); toast(status==='Completed Without PO'?'Service report submitted, recorded as Sales, and marked Pending PO.':'Service report submitted and Sales entry recorded.'); render();
}

function openLinkPendingPOForm(reportId){
  if(currentRole!=='ADMIN') return;
  const r=serviceReports().find(x=>x.id===reportId);
  if(!r || r.poId){ toast('This service report is already linked to a PO.'); return; }
  const pos=servicePOs().filter(p=>p.active!==false && p.poType==='Service');
  const opts=pos.map(p=>`<option value="${esc(p.id)}">${esc(p.poNo||'—')} — ${esc(p.customer||'')} </option>`).join('');
  openModal(`<div class="modal-head"><h3>Link Pending Service to PO</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <div class="card" style="margin:0 0 12px"><div><b>${esc(r.customer||'')}</b> — ${esc(r.workType||'')}</div><div class="hint">Completed: ${fmt2(r.quantity)} ${esc(serviceUnitLabel(r.unit||'Nos'))} on ${esc(r.date||'')}</div></div>
    <label>Select Service PO</label><select id="link_po" onchange="loadLinkPOTasks()"><option value="">Select PO</option>${opts}</select>
    <label>PO Task</label><select id="link_po_line"><option value="">Select PO task</option></select>
    <div id="link_po_info" class="hint"></div><div id="link_po_err" class="small" style="color:var(--red);"></div>
    <div class="btn-row"><button class="btn-primary" onclick="saveLinkPendingPO('${r.id}')">Link PO</button><button class="btn-ghost" onclick="closeModal()">Cancel</button></div>`);
  window._linkPendingReportId=reportId;
}
function loadLinkPOTasks(){
  const po=servicePOs().find(p=>p.id===document.getElementById('link_po')?.value);
  const sel=document.getElementById('link_po_line'); const info=document.getElementById('link_po_info');
  if(!sel)return; sel.innerHTML='<option value="">Select PO task</option>';
  if(!po){if(info)info.textContent='';return;}
  servicePOLinesWithRemaining(po).filter(l=>l.remaining>0).forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=`${l.description||'Task'} — Remaining ${fmt2(l.remaining)} ${serviceUnitLabel(l.unit||'Nos')}`;sel.appendChild(o);});
  if(info) info.textContent=sel.options.length===1?'No PO task has sufficient remaining quantity.':'Select the matching task; the service quantity will be checked against the remaining PO quantity.';
}
async function saveLinkPendingPO(reportId){
  if(currentRole!=='ADMIN') return;
  const r=serviceReports().find(x=>x.id===reportId), po=servicePOs().find(p=>p.id===document.getElementById('link_po')?.value), line=po&&poLineRows(po).find(x=>x.id===document.getElementById('link_po_line')?.value);
  const err=document.getElementById('link_po_err');
  if(!r||r.poId){err.textContent='Service report is already linked.';return;}
  if(!po){err.textContent='Please select a Service PO.';return;}
  if(!line){err.textContent='Please select a PO task.';return;}
  const rem=servicePOLineRemaining(po,line);
  if(Number(r.quantity||0)>rem+0.000001){err.textContent=`This report is ${fmt2(r.quantity)} ${serviceUnitLabel(r.unit||line.unit||'Nos')}, but only ${fmt2(rem)} ${serviceUnitLabel(line.unit||'Nos')} remains on the selected task.`;return;}
  r.poId=po.id; r.poNo=po.poNo||''; r.poLineId=line.id; r.jobStatus='Completed'; r.pendingPOStatus='Linked PO';
  const entry=DB.entries.find(e=>e.id===r.autoEntryId || e.serviceReportId===r.id);
  if(entry){
    const rate=servicePORate(po,line.description||r.workType,line.id);
    entry.poId=po.id; entry.poNo=po.poNo||''; entry.poType='Service'; entry.pendingPO=false; entry.pendingPOStatus='Linked PO';
    if(rate>0){entry.salesRate=rate;entry.salesQty=Number(r.quantity||0);}
  }
  DB.serviceReports=serviceReports();
  await saveKey('serviceReports');
  await saveKey('entries');
  closeModal(); toast('Pending service linked to PO successfully.'); render();
}
window.openLinkPendingPOForm=openLinkPendingPOForm;
window.loadLinkPOTasks=loadLinkPOTasks;
window.saveLinkPendingPO=saveLinkPendingPO;

function viewPendingPO(){
  if(currentRole!=='ADMIN') return '<div class="card"><div class="empty">Admin access only.</div></div>';
  const reports=serviceReports().filter(r=>r.jobStatus==='Completed Without PO' || (r.jobStatus==='Completed' && !r.poId));
  const pendingPOReports=reports.filter(r=>!r.poId);
  const serviceOpen=[];
  servicePOs().filter(p=>p.active!==false && p.poType==='Service').forEach(po=>{
    servicePOLinesWithRemaining(po).forEach(line=>{ if(line.remaining>0) serviceOpen.push({po,line}); });
  });
  const supplyOpen=[];
  servicePOs().filter(p=>p.active!==false && p.poType==='Sales').forEach(po=>{
    const b=poBalance(po); if(b.pending>0) supplyOpen.push({po,b});
  });
  return `<div class="card"><div class="row-flex"><h2>Pending PO</h2><button class="btn-primary btn-sm" onclick="openServicePOForm()">+ New PO</button></div>
    <div class="hint">Service completed before a PO arrives is still recorded as Sales and stays here as Pending PO until Admin links it to a PO.</div>
    ${pendingPOReports.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Qty</th><th>Employee</th><th>Status</th><th></th></tr></thead><tbody>${pendingPOReports.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.customer||'—')}</td><td>${esc(r.workType||'—')}</td><td>${fmt2(r.quantity)} ${esc(serviceUnitLabel(r.unit))}</td><td>${esc(r.empName||'—')}</td><td>${statusTag('Pending PO')}</td><td><button class="btn-gold btn-sm" onclick="openLinkPendingPOForm('${r.id}')">Link PO</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No service is waiting for a PO.</div>'}
  </div>
  <div class="card"><h2>Pending Service</h2>${serviceOpen.length?`<div class="tbl-wrap"><table><thead><tr><th>PO</th><th>Customer</th><th>Task</th><th>Assigned</th><th>Remaining</th><th>Status</th></tr></thead><tbody>${serviceOpen.map(x=>`<tr><td>${esc(x.po.poNo)}</td><td>${esc(x.po.customer)}</td><td>${esc(x.line.description||'Task')}</td><td>${fmt2(x.line.qty)} ${esc(serviceUnitLabel(x.line.unit||'Nos'))}</td><td class="num"><b>${fmt2(x.line.remaining)} ${esc(serviceUnitLabel(x.line.unit||'Nos'))}</b></td><td>${statusTag('Pending')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No pending service tasks.</div>'}</div>
  <div class="card"><h2>Pending Supply</h2>${supplyOpen.length?`<div class="tbl-wrap"><table><thead><tr><th>PO</th><th>Customer</th><th>PO Value</th><th>Used</th><th>Pending</th><th>Status</th></tr></thead><tbody>${supplyOpen.map(x=>`<tr><td>${esc(x.po.poNo)}</td><td>${esc(x.po.customer)}</td><td class="num">${fmt2(x.b.total)}</td><td class="num">${fmt2(x.b.used)}</td><td class="num"><b>${fmt2(x.b.pending)}</b></td><td>${statusTag(poStatus(x.po))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No pending supply.</div>'}</div>`;
}
window.viewPendingPO=viewPendingPO;

function statusTag(s){
  if(!s) return '<span class="small">—</span>';
  const up = s.toUpperCase();
  if(up.includes('RECEIVED')||up==='PAID') return `<span class="tag tag-green">${esc(s)}</span>`;
  if(up.includes('NOT')||up==='UNPAID') return `<span class="tag tag-red">${esc(s)}</span>`;
  return `<span class="tag tag-amber">${esc(s)}</span>`;
}

async function saveEntry(id){
  const data = {
    id, date:document.getElementById('f_date').value, item:document.getElementById('f_item').value,
    nature:document.getElementById('f_nature').value,
    poId:document.getElementById('f_po')?.value||'',
    poNo:(servicePOs().find(p=>p.id===document.getElementById('f_po')?.value)?.poNo)||'',
    poType:(servicePOs().find(p=>p.id===document.getElementById('f_po')?.value)?.poType)||'',
    salesQty:parseFloat(document.getElementById('f_sq').value)||0, salesRate:parseFloat(document.getElementById('f_sr').value)||0,
    custStatus:document.getElementById('f_cstatus').value,
    purQty:parseFloat(document.getElementById('f_pq').value)||0, purRate:parseFloat(document.getElementById('f_pr').value)||0,
    vendStatus:document.getElementById('f_vstatus').value,
    promoPct:parseFloat(document.getElementById('f_promo').value)||0,
    sourceAccount:document.getElementById('f_acc').value,
  };
  if(data.poId){
    const po=servicePOs().find(p=>p.id===data.poId);
    if(!po){toast('Selected PO not found');return;}
    if(po.poType!==data.nature){toast('Selected PO type does not match Nature of Job');return;}
    const usedExcluding=(DB.entries||[]).filter(x=>x.id!==id && (x.poId===po.id || x.servicePOId===po.id)).reduce((sum,x)=>sum+Number(calcEntry(x).salesTaxable||0),0);
    const currentAmount=(Number(data.salesQty)||0)*(Number(data.salesRate)||0);
    const pending=Math.max(0,Number(po.poValue||0)-usedExcluding);
    if(currentAmount>pending+0.005){toast(`Sales amount exceeds pending PO balance of ${fmt2(pending)}`);return;}
  }
  const idx = DB.entries.findIndex(x=>x.id===id);
  if(idx>=0) DB.entries[idx] = data; else DB.entries.push(data);
  await saveKey('entries');
  closeModal(); toast('Entry saved'); render();
}
async function deleteEntry(id){
  DB.entries = DB.entries.filter(x=>x.id!==id);
  await saveKey('entries'); closeModal(); toast('Entry deleted'); render();
}
window.openEntryForm = openEntryForm; window.saveEntry = saveEntry; window.deleteEntry = deleteEntry;
function loadEntryPOOptions(){
  const sel=document.getElementById('f_po'), type=document.getElementById('f_nature')?.value;
  if(!sel) return;
  const current=sel.value;
  const opts=servicePOs().filter(p=>p.active!==false && p.poType===type && poBalance(p).pending>0)
    .map(p=>`<option value="${esc(p.id)}">${esc(p.poNo)} — ${esc(p.customer)} — Pending ${fmt2(poBalance(p).pending)}</option>`).join('');
  sel.innerHTML=`<option value="">No PO / Direct Entry</option>${opts}`;
  if(servicePOs().some(p=>p.id===current && p.poType===type)) sel.value=current;
}
window.loadEntryPOOptions=loadEntryPOOptions;

function viewTimeLog(){
  const dayRows = DB.timelog.filter(t=>t.date===attDate);

    ? (employeeForUser() ? [employeeForUser()] : [])

  return `

        const rec = dayRows.find(t=>t.empId===emp.id) || {};

        return `<tr>

function attStatusTag(s){
  if(s==='On Time') return '<span class="tag tag-green">On Time</span>';
  if(s==='Late') return '<span class="tag tag-amber">Late</span>';
  if(s==='Half Day') return '<span class="tag tag-amber">Half Day</span>';
  return '<span class="tag tag-red">Absent</span>';
}
async function setTimeLogCheckIn(empId,val){
 if(currentRole==='TIME_USER'&&empId!==(employeeForUser()?.id)){toast('You can change only your own time login');return;}
 if(isSunday(attDate)){toast('Sunday is a weekly off');render();return;}
 const existing=DB.timelog.find(t=>t.date===attDate&&t.empId===empId);if(existing&&existing.checkIn){toast('Check-In is already recorded and cannot be changed');return;}
 const save=async(lat,lng,acc)=>{DB.timelog=DB.timelog.filter(t=>!(t.date===attDate&&t.empId===empId));DB.timelog.push({id:uid(),date:attDate,empId,checkIn:val||'',approval:'',latitude:lat,longitude:lng,locationAccuracy:acc,locationLocked:true});DB.attendance=DB.attendance.filter(a=>!(a.date===attDate&&a.empId===empId));if(val){const c=computeTimeLog(val);DB.attendance.push({id:uid(),date:attDate,empId,status:c.phaStatus,latitude:lat,longitude:lng,locationLocked:true});}await saveKey('timelog');await saveKey('attendance');render();};
 if(val&&navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>save(p.coords.latitude,p.coords.longitude,p.coords.accuracy),()=>save(null,null,null),{enableHighAccuracy:true,timeout:10000,maximumAge:0}); else save(null,null,null);
}
async function setTimeLogApproval(empId, val){
  const rec = DB.timelog.find(t=>t.date===attDate && t.empId===empId);
  if(rec){ rec.approval = val; await saveKey('timelog'); render(); }
}
async function syncTimeLogToAttendance(){
  if(isSunday(attDate)){ toast('Sunday is a weekly off — nothing to sync'); return; }
  DB.employees.filter(x=>x.status!=='Inactive').forEach(emp=>{
    const rec = DB.timelog.find(t=>t.date===attDate && t.empId===emp.id);
    const c = computeTimeLog(rec ? rec.checkIn : '');
    let status = c.phaStatus;
    if((c.phaStatus==='H' || c.phaStatus==='A') && rec && rec.approval==='Approved') status = 'P';
    DB.attendance = DB.attendance.filter(a=>!(a.date===attDate && a.empId===emp.id));
    DB.attendance.push({id:uid(), date:attDate, empId:emp.id, status});
  });
  await saveKey('attendance'); toast('Synced to Daily Status'); attView='status'; render();
}
window.setTimeLogCheckIn=setTimeLogCheckIn; window.setTimeLogApproval=setTimeLogApproval; window.syncTimeLogToAttendance=syncTimeLogToAttendance;

function quoteTotals(q){
  const taxable = q.items.reduce((s,it)=>s+it.qty*it.rate,0);
  const gst = q.items.reduce((s,it)=>s+it.qty*it.rate*it.gst,0);
  return { taxable, gst, grand: taxable+gst };
}

function exportDatasetRows(type, from, to){
  const inRange = (d) => (!from || d >= from) && (!to || d <= to);
  let rows=[];
  if(type==='sales'){
    rows=(DB.entries||[]).filter(e=>inRange(e.date||'')).map(e=>{
      const c=calcEntry(e);
      return {Date:e.date||'',Item:e.item||'',Nature:e.nature||'',PO_No:e.poNo||'',Customer_Status:e.custStatus||'',Sales_Qty:e.salesQty||0,Sales_Rate:e.salesRate||0,Sales_Taxable:c.salesTaxable||0,GST:c.outputGst||0,Invoice_Total:c.salesInvoiceTotal||0,Promo_Cost:c.promoCost||0,Source_Account:e.sourceAccount||'',Service_Employee:e.serviceEmployeeName||'',Pending_PO:e.pendingPO?'Yes':'No'};
    });
  } else if(type==='service'){
    rows=(serviceReports()||[]).filter(r=>inRange(r.date||'')).map(r=>({Date:r.date||'',Customer:r.customer||'',Project:r.project||r.poProject||'',PO_No:r.poNo||'',Service:r.workType||'',Quantity:r.quantity||0,Unit:r.unit||'',Job_Status:r.jobStatus||'',Description:r.description||'',Employee:r.empName||'',Pending_PO:r.poId?'No':'Yes',Submitted_At:r.submittedAt||''}));
  } else if(type==='po'){
    rows=(DB.servicePOs||[]).filter(p=>inRange(p.date||p.poDate||'')).map(p=>({PO_No:p.poNo||'',PO_Date:p.date||p.poDate||'',Type:p.poType||'',Customer:p.customer||'',Project:p.project||'',GSTIN:p.customerGstin||p.gstin||'',Payment_Terms:p.paymentTerms||'',Transportation:p.transportation||'',Delivery_Terms:p.deliveryTerms||'',Basic_Total:poBalance(p).total||0,Used:poBalance(p).used||0,Pending_Value:poBalance(p).pending||0,Status:poStatus(p)}));
  } else if(type==='attendance'){
    rows=(DB.attendance||[]).filter(r=>inRange(r.date||'')).map(r=>({Date:r.date||'',Employee:r.empName||r.employeeName||r.empId||'',Status:r.status||r.attStatus||'',Check_In:r.checkIn||'',Check_Out:r.checkOut||'',Hours:r.hoursWorked||'',Remarks:r.remarks||''}));
  } else if(type==='claims'){
    rows=([...(DB.claims||[]),...(DB.advances||[])].filter(r=>inRange(r.date||r.claimDate||'')).map(r=>({Date:r.date||r.claimDate||'',Employee:r.empName||r.employeeName||r.empId||'',Type:r.type||'Claim',Category:r.claimType||r.category||'',Amount:Number(r.approvedAmount??r.amount??0)||0,Status:r.approvalStatus||r.status||'',Description:r.description||r.purpose||'',Remarks:r.remarks||''})));
  } else if(type==='expenses'){
    rows=(DB.advanceExpenses||[]).filter(r=>inRange(r.date||'')).map(r=>({Date:r.date||'',Employee:r.empName||r.employeeName||r.empId||'',Category:r.category||r.type||'',Amount:Number(r.amount||0)||0,Description:r.description||r.purpose||'',Status:r.status||r.approvalStatus||'',Remarks:r.remarks||''}));
  } else if(type==='employees'){
    rows=(DB.employees||[]).map(e=>({Employee_ID:e.empId||'',Name:e.name||'',Designation:e.designation||'',Department:e.department||'',Manager:e.manager||'',Status:e.status||''}));
  }
  return rows;
}
function csvEscape(v){
  if(v===null||v===undefined) return '';
  const x=String(v);
  return /[",\n\r]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x;
}
function downloadBlob(filename, text, mime='text/csv;charset=utf-8'){
  const blob=new Blob(['\\ufeff'+text],{type:mime});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadDataCSV(){
  const type=document.getElementById('ex_type')?.value||'sales';
  const from=document.getElementById('ex_from')?.value||'';
  const to=document.getElementById('ex_to')?.value||'';
  const rows=exportDatasetRows(type,from,to);
  if(!rows.length){toast('No data found for the selected export.');return;}
  const headers=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const csv=[headers.join(','),...rows.map(r=>headers.map(h=>csvEscape(r[h])).join(','))].join('\r\n');
  const stamp=todayStr(); downloadBlob(`Anushka_${type}_Export_${stamp}.csv`,csv);
  toast(`${rows.length} records exported`);
}

/* --- Approval Center: unified pending queue --- */
function pendingApprovals(){
  const items = [];
  (DB.advances||[]).filter(a=>a.approvalStatus==='Pending').forEach(a=>{
    const emp = DB.employees.find(x=>x.id===a.empId);
    items.push({kind:a.type, id:a.id, date:a.date, employee:emp?emp.name:'—', detail:a.category, amount:a.amount, source:'advances'});
  });
  (DB.claims||[]).filter(c=>(c.status||c.approvalStatus||'Pending')==='Pending').forEach(c=>{
    items.push({kind:'Claim', id:c.id, date:c.date, employee:c.empName||'—', detail:c.type||c.description||'Claim', amount:c.amount, source:'claims'});
  });
  (DB.advanceExpenses||[]).filter(x=>(x.status||x.approvalStatus||'Pending')==='Pending').forEach(x=>{
    items.push({kind:'Daily Expense', id:x.id, date:x.date, employee:x.empName||'—', detail:x.category||x.description||'Expense', amount:x.amount, source:'advanceExpenses'});
  });
  DB.timelog.filter(t=>{ const c=computeTimeLog(t.checkIn); return (c.phaStatus==='H'||c.phaStatus==='A') && !t.approval; }).forEach(t=>{
    const emp = DB.employees.find(x=>x.id===t.empId);
    items.push({kind:'Paid-Day', id:t.id, date:t.date, employee:emp?emp.name:'—', detail:'Time Log paid-day request', amount:null, source:'timelog'});
  });
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return items;
}
function viewApprovalCenter(){
  const items = pendingApprovals();
  return `
  <div class="card">
    <h2>Approval Center</h2>
    <div class="hint">Pending advances, claims, and Time Log paid-day requests in one place</div>
  </div>
  <div class="card">
    ${items.length===0 ? `<div class="empty">Nothing pending — you're all caught up.</div>` : `
    <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Employee</th><th>Detail</th><th>Amount</th><th></th></tr></thead><tbody>
      ${items.map(it=>`<tr>
        <td>${it.date}</td><td>${esc(it.kind)}</td><td>${esc(it.employee)}</td><td>${esc(it.detail||'')}</td>
        <td class="num">${it.amount!=null?fmt(it.amount):'—'}</td>
        <td>
          ${['advances','claims','advanceExpenses','leaveRequests'].includes(it.source) ? `
            <button class="btn-primary btn-sm" onclick="quickApprove('${it.id}', true, '${it.source}')">Approve</button>
            <button class="btn-danger btn-sm" onclick="quickApprove('${it.id}', false, '${it.source}')">Reject</button>
          ` : `<button class="btn-ghost btn-sm" onclick="setAttDate('${it.date}'); attView='timelog'; setTab('attendance');">Review in Time Log</button>`}
        </td>
      </tr>`).join('')}
    </tbody></table></div>`}
  </div>
  `;
}
async function quickApprove(id, approve, source='advances'){
  const status=approve?'Approved':'Rejected';
  if(source==='leaveRequests'){
    const r=(DB.leaveRequests||[]).find(x=>x.id===id);
    if(!r){ toast('Leave request not found'); return; }
    r.status=status;
    r.approvalStatus=status;
    await saveKey('leaveRequests');
    toast('Leave request '+status.toLowerCase());
    render();
    return;
  }
  if(source==='advances'){
    const a = (DB.advances||[]).find(x=>x.id===id); if(!a) return;
    a.approvalStatus=status;
    if(approve){ a.approvedAmount=a.amount; a.approvedBy=currentUser; a.approvalDate=todayStr(); }
    await saveKey('advances');
  } else if(source==='claims'){
    const c=(DB.claims||[]).find(x=>x.id===id); if(!c) return;
    c.status=status; c.approvalStatus=status; c.approvedBy=currentUser; c.actionAt=new Date().toISOString();
    await saveKey('claims');
  } else if(source==='advanceExpenses'){
    const x=(DB.advanceExpenses||[]).find(v=>v.id===id); if(!x) return;
    x.status=status; x.approvalStatus=status; x.approvedBy=currentUser; x.actionAt=new Date().toISOString();
    await saveKey('advanceExpenses');
  }
  toast(status); render();
}
window.quickApprove = quickApprove;

window.addEventListener('afterprint', ()=>{
  const sheet=document.getElementById('printSheet');
  if(sheet) sheet.innerHTML='';
