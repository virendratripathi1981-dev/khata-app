/* --- Quotation Items history (derived, read-only) --- */
function viewQuoteItemsHistory(){
  const rows = [];
  DB.quotations.forEach(q=> q.items.forEach(it=> rows.push({quoteNo:q.quoteNo, date:q.date, ...it})));
  rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `
  <div class="card">
    <h2>Quotation Item History</h2>
    <div class="hint">Every line item ever quoted, across all quotations</div>
    ${rows.length===0 ? '<div class="empty">No quotation items yet.</div>' : `
    <div class="tbl-wrap"><table><thead><tr><th>Quote No.</th><th>Date</th><th>Item</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.quoteNo)}</td><td>${r.date}</td><td>${esc(r.name)}</td><td class="num">${r.qty}</td><td class="num">${fmt(r.rate)}</td><td class="num">${pct(r.gst)}</td><td class="num">${fmt(r.qty*r.rate)}</td></tr>`).join('')}
    </tbody></table></div>`}
  </div>
  `;
}

/* --- Settings --- */
function viewSettings(){
  const m = DB.meta;
  return `
  <div class="card">
    <h2>Assumptions</h2>
    <div class="hint">Changes recalculate every report automatically</div>
    <div class="grid2">
      <div><label>GST Rate (%)</label><input type="number" id="s_gst" value="${(m.gstRate*100).toFixed(0)}"></div>
      <div><label>Working Days / Month</label><input type="number" id="s_wd" value="${m.workingDays}"></div>
    </div>
    <label>Company GSTIN</label><input id="s_gstin" value="${esc(m.companyGstin||'')}" placeholder="e.g. 09AAYCS4927P2Z2">
    <div class="hint">Shown on printed quotations and pay slips</div>
    <div class="btn-row"><button class="btn-primary" onclick="saveSettings()">Save</button></div>
  </div>
  <div class="card">
    <h2>Bank Accounts</h2>
    <div class="hint">Opening balances</div>
    ${m.accounts.map(a=>`<div class="grid2"><div><label>${esc(a)}</label></div><div><input type="number" id="s_open_${a.replace(/\W/g,'_')}" value="${m.opening[a]||0}"></div></div>`).join('')}
    <div class="btn-row"><button class="btn-primary" onclick="saveOpenings()">Save Balances</button></div>
  </div>
  <div class="card">
    <h2>Install this app</h2>
    <div class="hint">Add this app to your home screen for a full-screen, app-like experience.</div>
    <div class="stat-line"><span>iPhone (Safari)</span><span class="small">Share ↗ → Add to Home Screen</span></div>
    <div class="stat-line"><span>Android (Chrome)</span><span class="small">⋮ Menu → Add to Home screen / Install app</span></div>
  </div>
  <div class="card">
    <div class="row-flex"><h2>Logins</h2><button class="btn-primary btn-sm" onclick="openAddUserForm()">+ Add Login</button></div>
    <div class="hint">Virendra Tripathi and Sandhya Tripathi have Full Access. All other employees have Attendance, Submitted Claim and Daily Expense.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Username</th><th>Employee</th><th>Access</th><th></th></tr></thead><tbody>
      ${AUTH.users.map(u=>{
        const emp=(DB.employees||[]).find(e=>e.id===u.empId);
        const role=u.role||'TIME_USER';
        return `<tr><td>${esc(u.username)}${u.username===currentUser?' <span class="tag tag-navy">You</span>':''}</td>
        <td>${emp?esc(emp.name):'—'}</td>
        <td><span class="tag ${role==='TIME_USER'?'tag-amber':'tag-green'}">${role==='TIME_USER'?'TIME USER':'ADMIN'}</span></td>
        <td>${u.username!==currentUser ? `<button class="btn-danger btn-sm" onclick="removeUser('${esc(u.username)}')">Remove</button>` : ''}</td></tr>`;
      }).join('')}
    </tbody></table></div>
  </div>
  `;
}
async function saveSettings(){
  DB.meta.gstRate = (parseFloat(document.getElementById('s_gst').value)||18)/100;
  DB.meta.workingDays = parseFloat(document.getElementById('s_wd').value)||26;
  DB.meta.companyGstin = document.getElementById('s_gstin').value.trim();
  await saveKey('meta'); toast('Settings saved'); render();
}
async function saveOpenings(){
  DB.meta.accounts.forEach(a=>{
    const el = document.getElementById('s_open_'+a.replace(/\W/g,'_'));
    if(el) DB.meta.opening[a] = parseFloat(el.value)||0;
  });
  await saveKey('meta'); toast('Balances saved'); render();
}
window.saveSettings=saveSettings; window.saveOpenings=saveOpenings;

function openAddUserForm(){
  const opts = (DB.employees||[]).map(e=>`<option value="${esc(e.id)}">${esc(e.empId||'')} — ${esc(e.name)}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>Add Employee Login</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <label>Employee</label><select id="au_emp" onchange="updateLoginRoleHint()">${opts}</select>
    <div id="au_role_hint" class="hint" style="margin:8px 0;">Virendra Tripathi and Sandhya Tripathi get Full Access. Anil Maurya gets Submitted Claim only. All other employees get Attendance + Submitted Claim.</div>
    <label>Username</label><input id="au_user" autocapitalize="off" autocomplete="off">
    <label>Password</label><input id="au_pass" type="password">
    <div id="au_err" class="small" style="color:var(--red);"></div>
    <div class="btn-row">
      <button class="btn-primary" onclick="addUser()">Add Login</button>
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  `);
}
function updateLoginRoleHint(){
  const id=document.getElementById('au_emp')?.value;
  const role=roleForEmployee(id);
  const el=document.getElementById('au_role_hint');
  if(el) el.textContent=role==='ADMIN' ? 'FULL ACCESS — Virendra Tripathi / Sandhya Tripathi' : 'TIME USER — Attendance and Time Login only';
}
async function addUser(){
  const empId = document.getElementById('au_emp').value;
  const u = document.getElementById('au_user').value.trim();
  const p = document.getElementById('au_pass').value;
  const err = document.getElementById('au_err');
  const emp = (DB.employees||[]).find(e=>e.id===empId);
  if(!emp){ err.textContent='Select an employee.'; return; }
  if(!u || !p){ err.textContent='Enter a username and password.'; return; }
  if(AUTH.users.some(x=>x.username.toLowerCase()===u.toLowerCase())){ err.textContent='That username is taken.'; return; }
  const role = roleForEmployee(emp.id);
  const salt = randHex(16);
  const hash = await hashPassword(p, salt);
  AUTH.users.push({username:u, salt, hash, role, empId:emp.id});
  await saveAuth();
  cacheAuth();
  closeModal(); toast(role==='TIME_USER' ? 'Time User login added' : 'Admin login added'); render();
}
async function removeUser(username){
  AUTH.users = AUTH.users.filter(x=>x.username!==username);
  await saveAuth();
  cacheAuth(); toast('Login removed'); render();
}
window.openAddUserForm=openAddUserForm; window.addUser=addUser; window.removeUser=removeUser;

/* ============ Init ============ */
(async function init(){
  await loadAuth();
  renderAuthGate();
})();
</script>
